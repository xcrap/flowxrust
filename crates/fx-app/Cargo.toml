[package]
name = "fx-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FlowX application state and views."

[dependencies]
fx-agent.workspace = true
fx-core.workspace = true
fx-design.workspace = true
fx-store.workspace = true
gpui.workspace = true
uuid.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
anyhow.workspace = true
libc.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tempfile.workspace = true
pulldown-cmark.workspace = true
url.workspace = true
unicode-segmentation.workspace = true

# Only to read the Reduce Motion accessibility setting. Already in the tree
# through GPUI's renderer; these are the two features the one call needs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }

[dev-dependencies]
tempfile.workspace = true
chrono.workspace = true
gpui = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
